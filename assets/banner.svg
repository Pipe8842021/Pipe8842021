<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 230" width="830" height="230" role="img" aria-label="Juan Felipe Toro Londoño, desarrollador de software junior full stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2F5A"/>
      <stop offset="0.55" stop-color="#0A2342"/>
      <stop offset="1" stop-color="#061629"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
  </defs>

  <rect width="830" height="230" rx="14" fill="url(#bg)"/>
  <rect width="830" height="230" rx="14" fill="url(#grid)"/>

  <!-- símbolo de código, decorativo -->
  <text x="690" y="170" font-size="150" font-weight="700" fill="#38BDF8" fill-opacity="0.10" text-anchor="middle">&lt;/&gt;</text>

  <!-- piedras apiladas (cairn) -->
  <g fill="#38BDF8" fill-opacity="0.85">
    <ellipse cx="748" cy="176" rx="34" ry="11"/>
    <ellipse cx="748" cy="156" rx="25" ry="9" fill-opacity="0.7"/>
    <ellipse cx="748" cy="139" rx="16" ry="7" fill-opacity="0.55"/>
    <ellipse cx="748" cy="126" rx="9" ry="5" fill-opacity="0.4"/>
  </g>

  <text x="48" y="62" font-size="13" font-weight="600" letter-spacing="3" fill="#7DD3FC">DESARROLLADOR DE SOFTWARE  ·  FULL STACK</text>
  <text x="48" y="118" font-size="46" font-weight="700" fill="#FFFFFF">Juan Felipe Toro</text>
  <rect x="48" y="134" width="150" height="4" rx="2" fill="url(#accent)"/>
  <text x="48" y="172" font-size="18" fill="#CBD5E1">PHP  ·  MySQL  ·  JavaScript  ·  Docker  ·  Wompi<tspan class="cursor" fill="#38BDF8" font-weight="700"> _</tspan></text>
  <text x="48" y="202" font-size="14" fill="#94A3B8">Abejorral, Antioquia, Colombia</text>
</svg>
